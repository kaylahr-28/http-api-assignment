<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    let response = {
      message: "",
    }
    //changes innerHTML of page based on status code
    const handleResponse = async (response) => {
      const content = document.querySelector('#content');
      const type = document.querySelector("#type").value;
      const page = document.querySelector("#page").value;

      switch (response.status) {
        //200,400,200,401,403,500,501,404
        case 200:
          content.innerHTML = `<b>Success</b>`;
          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 401:
          content.innerHTML = `<b>Unauthorized</b>`;
          break;
        case 403:
          content.innerHTML = `<b>Forbidden</b>`;
          break;
        case 500:
          content.innerHTML = `<b>Internal Server Error</b>`;
          break;
        case 501:
          content.innerHTML = `<b>Not Implemented</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Resource Not Found</b>`;
          break;
        default:
          break;
      }

      let obj;
      const parser = new DOMParser();

      if (type === "text/xml") {
        obj = await response.text();
        // console.log('obj is', obj);
      }
      else if (type === "application/json") {
        obj = await response.json();
      } else {
        obj = await response.json();
      }
      console.log('obj is:', obj);
      //If we have a message, display it.
      if (obj.message) {
        content.innerHTML += `<p>Message json: ${obj.message}</p>`;
      }
      else {
        const xmlInfo = parser.parseFromString(obj, 'text/xml');
        if (xmlInfo.querySelector('response message').textContent) {
          content.innerHTML += `<p>Message XML: ${xmlInfo.querySelector('response message').textContent}</p>`;
        }
      }
    };

    const sendMessage = async () => {

      let selectData = "";

      // switch (type) {
      //   case '/success':
      //     selectData = formatMessage(type, "This is a successful response", false);
      //     break;
      //   case '/badRequest':
      //     selectData = formatMessage(type, "Missing valid query parameter set to true", 'badRequest');
      //     break;
      //   case '/unauthorized':
      //     selectData = formatMessage(type, "Missing loggedIn query parameter set to yes", 'unauthorized');
      //     break;
      //   case '/forbidden':
      //     selectData = formatMessage(type, "You do not have access to this content", 'forbidden');
      //     break;
      //   case '/internal':
      //     selectData = formatMessage(type, "Internal server error: something went wrong", 'internalError');
      //     break;
      //   case '/notImplemented':
      //     selectData = formatMessage(type, "A get request for this page has not been implemented yet. Check again later for updated content", 'notImplemented');
      //     break;
      //   default:
      //     selectData = formatMessage(type, "The page you are looking for was not found", 'notFound');
      //     break;
      // }
      const response = await fetch(page.value, {
        method: "POST",
        headers: {
          'Content-Type': type.value,
          // 'Content-Length': selectData.length,
          'Accept': type.value,
        },
        body: "testingnn",
      });

      handleResponse(response);
    }






    const init = () => {
      const sendBtn = document.querySelector("#send");

      sendBtn.addEventListener('click', sendMessage);
    };

    window.onload = init;

  </script>
</head>

<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
