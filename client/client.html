<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    let response = {
      message: "",
    }

    /**
     * handleResponse: changes innerHTML of page based on status codes.
     * places message on page from json or xml content
     */
    const handleResponse = async (response) => {
      const content = document.querySelector('#content');
      const type = document.querySelector("#type").value;
      const page = document.querySelector("#page").value;

      //html heading changes based on status code
      switch (response.status) {
        case 200:
          content.innerHTML = `<b>Success</b>`;
          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 401:
          content.innerHTML = `<b>Unauthorized</b>`;
          break;
        case 403:
          content.innerHTML = `<b>Forbidden</b>`;
          break;
        case 500:
          content.innerHTML = `<b>Internal Server Error</b>`;
          break;
        case 501:
          content.innerHTML = `<b>Not Implemented</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Resource Not Found</b>`;
          break;
        default:
          content.innerHTML = `<b>Resource Not Found</b>`;
          break;
      }

      let obj;

      //for xml parsing
      const parser = new DOMParser();

      if (type === "text/xml") {
        obj = await response.text();
      }
      else if (type === "application/json") {
        obj = await response.json();
      } else {
        obj = await response.json();
      }

      //display message based on whether its json or xml
      if (obj.message) {
        content.innerHTML += `<p>Message: ${obj.message}</p>`;
      }
      else {
        const xmlInfo = parser.parseFromString(obj, 'text/xml');
        if (xmlInfo.querySelector('response message').textContent) {
          content.innerHTML += `<p>Message: ${xmlInfo.querySelector('response message').textContent}</p>`;
        }
      }
    };

    /**
       * sendMessage: fetches response and provides info
       * based on selected options
       */
    const sendMessage = async () => {
      const response = await fetch(page.value, {
        method: "GET",
        headers: {
          'Content-Type': type.value,
          'Accept': type.value,
        },
      });

      handleResponse(response);
    }

    const init = () => {
      const sendBtn = document.querySelector("#send");

      sendBtn.addEventListener('click', sendMessage);
    };

    window.onload = init;

  </script>
</head>

<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>

</html>
