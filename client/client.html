<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    let response = {
      message: "",
    }
    //changes innerHTML of page based on status code
    const handleResponse = async (response) => {
      const content = document.querySelector('#content');

      switch (response.status) {
        //200,400,200,401,403,500,501,404
        case 200:
          content.innerHTML = `<b>Success</b>`;

          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 401:
          content.innerHTML = `<b>Unauthorized</b>`;
          break;
        case 403:
          content.innerHTML = `<b>Forbidden</b>`;
          break;
        case 500:
          content.innerHTML = `<b>Internal Server Error</b>`;
          break;
        case 501:
          content.innerHTML = `<b>Not Implemented</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Resource Not Found</b>`;
          break;
        default:
          break;
      }

      const obj = await response.json();
      if (obj.message) {
        content.innerHTML += `<p>${obj.message}</p>`;
      }
    };

    const parseMessage = (type, message, id) => {
      if (type === "application/json") {
        response.message = message;
        if (id) {
          response.id = id;
        }
        return JSON.stringify(response);

      } else if (type === "text/html") {

        let response = `<response>
    <message>${message}</message>`;
        if (id) {
          response += `<id>${id}</id>`;
        }
        response += '</response>';
        console.log(response.status);
        return response;
      }
    }

    const sendMessage = async () => {
      const type = document.querySelector("#type").value;
      const page = document.querySelector("#page").value;

      let formData = "";

      switch (type) {
        case '/success':
          formData = parseMessage(type, "This is a successful response", false);
          break;
        case '/badRequest':
          formData = parseMessage(type, "Missing valid query parameter set to true", 'badRequest');
          break;
        case '/unauthorized':
          formData = parseMessage(type, "Missing loggedIn query parameter set to yes", 'unauthorized');
          break;
        case '/forbidden':
          formData = parseMessage(type, "You do not have access to this content", 'forbidden');
          break;
        case '/internal':
          formData = parseMessage(type, "Internal server error: something went wrong", 'internalError');
          break;
        case '/notImplemented':
          formData = parseMessage(type, "A get request for this page has not been implemented yet. Check again later for updated content", 'notImplemented');
          break;
        default:
          formData = parseMessage(type, "The page you are looking for was not found", 'notFound');
          break;
      }

      //fix url variable??
      const response = await fetch("/", {
        method: "POST",
        headers: {
          'Content-Type': type.value,
          'Accept': type.value,
        },
        body: formData,
      });

      handleResponse(response);
    }






    const init = () => {
      const sendBtn = document.querySelector("#send");

      sendBtn.addEventListener('click', () => { sendMessage });
    };

    window.onload = init;

  </script>
</head>

<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>

</html>
